include ~/.config/kitty/catppuccin-mocha.conf

env TERM=xterm-256color
term xterm-256color

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

hide_window_decorations yes
cursor_shape beam
mouse_hide_wait 3.0

# shift+enter -> ESC + CR (matches ghostty keybind)
map shift+enter send_text all \x1b\r
